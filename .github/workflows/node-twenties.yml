name: 'Tests: node.js >= 20'

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    name: 'node ${{ matrix.node-version }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [26, 24, 22, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm config set registry 'https://:2026-08-29T23%3A50%3A15.803000Z@time-machines-npm.sealsecurity.io/'
      - run: npm install
      - run: npm run tests-only

  pack:
    name: 'pack qs-6.16.0.tgz'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # the published tarball was packed with node 26.7.0 / npm 11.19.0; pinning
      # the node patch pins that exact npm, and with it npm pack's member set.
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - run: npm config set registry 'https://:2026-08-29T23%3A50%3A15.803000Z@time-machines-npm.sealsecurity.io/'
      - run: npm install
      # `prepack` runs `npm run dist`, so `npm pack` rebuilds dist/qs.js.
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: qs-6.16.0-tgz
          path: qs-6.16.0.tgz
          if-no-files-found: error

  node:
    name: 'node >= 20'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: true
